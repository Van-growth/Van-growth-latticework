# Dev 환경 전용 Render Blueprint.
#
# 기존 render.yaml(= main 브랜치, 이미 살아있는 prod cron Blueprint)은 건드리지 않았습니다 —
# 이미 등록된 prod Blueprint가 이 파일을 다시 sync할 때, 여기 정의한 서비스들이 이름이
# 안 맞으면 기존 서비스를 덮어쓰는 대신 중복 생성할 위험이 있어서 분리했습니다.
#
# 사용법 (Render 대시보드):
#   1. New > Blueprint
#   2. 이 저장소 선택, Branch를 "dev"로 지정
#   3. "Blueprint file path"를 render.dev.yaml로 지정 (기본값 render.yaml이 아님에 주의)
#   4. 아래 sync:false 로 표시된 값들을 각 서비스 환경변수 화면에서 채워넣기
#      (.env.dev 템플릿에 필요한 키 전체 목록 + 설명 정리해둠)
#
# 서비스명은 prod로 추정되는 이름(latticework-client.onrender.com 등, server/src/index.ts의
# CORS 허용목록 기준)에 -dev를 붙여 지었습니다. 실제 prod 서비스명과 다를 수 있으니
# Blueprint 생성 전에 확인해서 필요하면 바꿔주세요 — 이름이 겹치면 안 됩니다.
#
# EDGAR/DART 배치 크론은 정의만 해뒀습니다 — 월 1회 수 시간짜리 대량 배치라 dev에서
# 스케줄대로 돌릴 필요는 보통 없습니다(무료 API 키 한도만 소모). Blueprint 생성 시
# 이 두 서비스는 "Suspended" 상태로 만들어두고 필요할 때만 수동 Resume 하는 걸 권장합니다.

services:
  # ── Dev: Server (Express) ────────────────────────────────────────────────────
  - type: web
    name: latticework-server-dev
    runtime: node
    branch: dev
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: APP_ENV
        value: development
      - key: CLIENT_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DART_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: KIS_APP_KEY
        sync: false
      - key: KIS_APP_SECRET
        sync: false
      - key: PREMIUM_OVERRIDE_CLIENT_IDS
        sync: false
      - key: ADMIN_USER_IDS
        sync: false

  # ── Dev: Client (Next.js) ─────────────────────────────────────────────────────
  - type: web
    name: latticework-client-dev
    runtime: node
    branch: dev
    rootDir: client
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_APP_ENV
        value: development
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_KEY
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_HOST
        sync: false
      - key: NEXT_PUBLIC_CLARITY_ID
        sync: false

  # ── Dev: EDGAR 배치 (기본 suspended 권장 — 위 설명 참고) ─────────────────────────
  - type: cron
    name: edgar-batch-dev
    runtime: node
    branch: dev
    rootDir: server
    schedule: "0 2 1 * *"
    buildCommand: npm install --production=false && npm run build
    startCommand: npx ts-node scripts/edgarBatchPrecompute.ts
    envVars:
      - key: APP_ENV
        value: development
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DART_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false

  # ── Dev: DART 배치 (기본 suspended 권장 — 위 설명 참고) ──────────────────────────
  - type: cron
    name: dart-batch-dev
    runtime: node
    branch: dev
    rootDir: server
    schedule: "0 3 1 * *"
    buildCommand: npm install --production=false && npm run build
    startCommand: npx ts-node scripts/dartBatchPrecompute.ts
    envVars:
      - key: APP_ENV
        value: development
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DART_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
